<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .brand-font {
            font-family: 'Poppins', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 999px;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .todo-item {
            animation: popIn 0.25s ease-out;
        }

        .todo-item.dragging {
            opacity: 0.4;
        }

        .todo-item.drag-over {
            border-top: 3px solid #06b6d4;
        }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
        }

        @keyframes pulseSkeleton {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 0.9;
            }
        }

        .skeleton {
            animation: pulseSkeleton 1.2s ease-in-out infinite;
        }

        @keyframes fadeInModal {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleInModal {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-overlay {
            animation: fadeInModal 0.2s ease-out;
        }

        .modal-box {
            animation: scaleInModal 0.2s ease-out;
        }
    </style>
</head>

<body>

    <div id="appRoot"
        class="dark relative flex h-dvh w-dvw flex-col items-center bg-[rgba(255,255,255,0.75)] dark:bg-[rgba(0,0,0,0.8)] bg-[url('assets/6880515.webp')] bg-cover bg-no-repeat bg-blend-overlay dark:bg-blend-multiply overflow-y-auto transition-colors duration-300">

        <!-- Top-left: Stats button -->
        <button id="statsBtn" type="button"
            class="absolute top-4 left-4 sm:top-6 sm:left-6 z-10 rounded-full bg-black/10 dark:bg-white/20 backdrop-blur p-2.5 hover:cursor-pointer hover:scale-105 active:scale-90 transition shadow-lg"
            aria-label="View stats">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-5 text-gray-800 dark:text-white transition-colors">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
            </svg>
        </button>

        <!-- Theme toggle -->
        <button id="themeToggle" type="button"
            class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10 rounded-full bg-black/10 dark:bg-white/20 backdrop-blur p-2.5 hover:cursor-pointer hover:scale-105 active:scale-90 transition shadow-lg"
            aria-label="Toggle dark/light mode">
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-5 text-white hidden">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
            </svg>
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-5 text-gray-800 hidden">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-6.364-.386 1.591-1.591M3 12h2.25m.386-6.364 1.591 1.591M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
        </button>

        <div class="flex flex-col items-center w-full pt-8 pb-3">
            <h1
                class="brand-font text-4xl sm:text-5xl font-bold text-gray-900 dark:text-white tracking-tight drop-shadow-lg transition-colors">
                Todo List</h1>
            <p id="counterText" class="text-gray-600 dark:text-white/70 text-sm mt-1 tracking-wide transition-colors">
                Loading...</p>
        </div>

        <!-- Progress bar -->
        <div class="w-11/12 max-w-xl mb-4">
            <div class="w-full h-2 bg-black/10 dark:bg-white/20 rounded-full overflow-hidden transition-colors">
                <div id="progressBar" class="h-full bg-cyan-500 rounded-full transition-all duration-300"
                    style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-gray-500 dark:text-white/60 text-xs mt-1 text-right transition-colors">0%
                complete</p>
        </div>

        <!-- Main add row -->
        <div class="flex w-11/12 max-w-xl justify-between gap-3">
            <input id="taskInput" type="text" placeholder="Enter Your New Task..."
                class="w-11/12 rounded-4xl bg-white/95 backdrop-blur px-5 py-3 outline-none text-gray-800 placeholder:text-gray-400 shadow-lg focus:ring-2 focus:ring-cyan-400 transition" />

            <button id="addBtn" type="button"
                class="rounded-full bg-cyan-500 p-3 hover:cursor-pointer hover:bg-cyan-400 active:scale-90 transition shadow-lg shadow-cyan-500/40">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6 text-white">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </button>
        </div>

        <!-- Extra fields: due date, reminder, category -->
        <div class="flex flex-wrap w-11/12 max-w-xl justify-center gap-2 mt-3">
            <label
                class="flex items-center gap-1 rounded-full bg-white/90 backdrop-blur px-3 py-1.5 text-sm text-gray-700 shadow">
                📅 <input id="dueDateInput" type="date" class="outline-none bg-transparent hover:cursor-pointer" />
            </label>
            <label
                class="flex items-center gap-1 rounded-full bg-white/90 backdrop-blur px-3 py-1.5 text-sm text-gray-700 shadow">
                🔔 <input id="reminderInput" type="datetime-local"
                    class="outline-none bg-transparent hover:cursor-pointer" title="Set a reminder" />
            </label>
            <input id="categoryInput" list="categoryOptions" type="text" placeholder="Category (optional)"
                class="rounded-full bg-white/90 backdrop-blur px-3 py-1.5 text-sm text-gray-700 outline-none shadow placeholder:text-gray-400 focus:ring-2 focus:ring-cyan-400 transition w-40" />
            <datalist id="categoryOptions">
                <option value="Work"></option>
                <option value="Personal"></option>
                <option value="Shopping"></option>
                <option value="Health"></option>
            </datalist>
        </div>

        <!-- Filter tabs + Sort -->
        <div class="flex flex-wrap w-11/12 max-w-xl justify-center items-center gap-2 mt-4">
            <button type="button" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium transition"
                data-filter="all">All</button>
            <button type="button" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium transition"
                data-filter="active">Active</button>
            <button type="button" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium transition"
                data-filter="completed">Completed</button>

            <select id="sortSelect"
                class="rounded-full bg-black/10 dark:bg-white/20 backdrop-blur px-3 py-1.5 text-sm text-gray-700 dark:text-white outline-none shadow hover:cursor-pointer transition-colors">
                <option value="manual">↕️ Manual order</option>
                <option value="newest">🆕 Newest first</option>
                <option value="oldest">⏳ Oldest first</option>
                <option value="dueDate">📅 By due date</option>
                <option value="az">🔤 A → Z</option>
            </select>
        </div>

        <!-- Search -->
        <div class="w-11/12 max-w-xl mt-3">
            <input id="searchInput" type="text" placeholder="🔍 Search tasks..."
                class="w-full rounded-full bg-black/10 dark:bg-white/20 backdrop-blur px-4 py-2 text-sm outline-none text-gray-800 dark:text-white placeholder:text-gray-500 dark:placeholder:text-white/60 focus:ring-2 focus:ring-cyan-400 transition-colors" />
        </div>

        <div id="todoList" class="list-of-todoItems w-11/12 max-w-xl my-5 flex flex-col gap-3 pb-8">
            <!-- Todo items / skeleton / empty state rendered here -->
        </div>
    </div>

    <!-- Undo toast -->
    <div id="undoToast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 z-50 flex items-center gap-4 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl transition-all duration-300">
        <span id="undoToastText" class="text-sm">Task deleted</span>
        <button id="undoBtn" type="button"
            class="text-cyan-400 text-sm font-semibold hover:cursor-pointer hover:text-cyan-300">Undo</button>
    </div>

    <!-- Reminder fallback toast -->
    <div id="reminderToast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 z-50 flex items-center gap-3 bg-cyan-600 text-white px-5 py-3 rounded-full shadow-2xl transition-all duration-300">
        <span id="reminderToastText" class="text-sm">🔔 Reminder</span>
    </div>

    <!-- Stats Modal -->
    <div id="statsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 modal-overlay p-4">
        <div class="modal-box bg-white dark:bg-gray-900 rounded-3xl shadow-2xl w-full max-w-md p-6 transition-colors">
            <div class="flex items-center justify-between mb-4">
                <h2 class="brand-font text-2xl font-bold text-gray-900 dark:text-white">📈 Your Stats</h2>
                <button id="closeStatsBtn" type="button"
                    class="p-1.5 rounded-full hover:cursor-pointer hover:bg-gray-100 dark:hover:bg-white/10 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="size-5 text-gray-500 dark:text-white/70">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-gray-100 dark:bg-white/10 rounded-2xl p-3 text-center">
                    <p id="statTotal" class="text-2xl font-bold text-gray-900 dark:text-white">0</p>
                    <p class="text-xs text-gray-500 dark:text-white/60">Total</p>
                </div>
                <div class="bg-gray-100 dark:bg-white/10 rounded-2xl p-3 text-center">
                    <p id="statActive" class="text-2xl font-bold text-gray-900 dark:text-white">0</p>
                    <p class="text-xs text-gray-500 dark:text-white/60">Active</p>
                </div>
                <div class="bg-gray-100 dark:bg-white/10 rounded-2xl p-3 text-center">
                    <p id="statRate" class="text-2xl font-bold text-cyan-500">0%</p>
                    <p class="text-xs text-gray-500 dark:text-white/60">Done</p>
                </div>
            </div>

            <p class="text-sm font-semibold text-gray-700 dark:text-white/80 mb-2">Completed in the last 7 days</p>
            <div id="statsChart"
                class="flex items-end justify-between gap-2 h-28 bg-gray-50 dark:bg-white/5 rounded-2xl p-3"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'todoAppData';
        const THEME_KEY = 'todoAppTheme';
        const LOG_KEY = 'todoAppCompletionLog';

        let todos = [];
        let completionLog = []; // array of ISO timestamps
        let editingId = null;
        let currentFilter = 'all';
        let currentSort = 'manual';
        let expandedSubtaskId = null;
        let draggedId = null;
        let lastDeleted = null;
        let undoTimeout = null;
        let reminderCheckInterval = null;

        const taskInput = document.getElementById('taskInput');
        const dueDateInput = document.getElementById('dueDateInput');
        const reminderInput = document.getElementById('reminderInput');
        const categoryInput = document.getElementById('categoryInput');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const themeToggle = document.getElementById('themeToggle');
        const iconSun = document.getElementById('iconSun');
        const iconMoon = document.getElementById('iconMoon');
        const undoToast = document.getElementById('undoToast');
        const reminderToast = document.getElementById('reminderToast');
        const statsBtn = document.getElementById('statsBtn');
        const statsModal = document.getElementById('statsModal');
        const closeStatsBtn = document.getElementById('closeStatsBtn');

        // ---------- Theme ----------
        function applyTheme(isDark) {
            document.documentElement.classList.toggle('dark', isDark);
            iconSun.classList.toggle('hidden', isDark);
            iconMoon.classList.toggle('hidden', !isDark);
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            applyTheme(saved !== 'light');
        }

        themeToggle.addEventListener('click', () => {
            applyTheme(!document.documentElement.classList.contains('dark'));
        });

        // ---------- Storage ----------
        function saveToStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (e) { console.warn(e); }
        }
        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) todos = JSON.parse(raw);
                todos.forEach(t => {
                    if (!Array.isArray(t.subtasks)) t.subtasks = [];
                    if (typeof t.pinned !== 'boolean') t.pinned = false;
                });
            } catch (e) { console.warn(e); todos = []; }
        }
        function saveLog() {
            try { localStorage.setItem(LOG_KEY, JSON.stringify(completionLog)); } catch (e) { console.warn(e); }
        }
        function loadLog() {
            try {
                const raw = localStorage.getItem(LOG_KEY);
                completionLog = raw ? JSON.parse(raw) : [];
            } catch (e) { completionLog = []; }
        }

        // ---------- CRUD ----------
        function addTodo() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const dueDate = dueDateInput.value || null;
            const reminderAt = reminderInput.value || null;
            const category = categoryInput.value.trim();

            if (reminderAt && 'Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            if (editingId !== null) {
                const todo = todos.find(t => t.id === editingId);
                if (todo) {
                    todo.text = text;
                    todo.dueDate = dueDate;
                    todo.category = category;
                    todo.reminderAt = reminderAt;
                    todo.reminderFired = false;
                }
                editingId = null;
                addBtn.innerHTML = addIconSVG();
            } else {
                todos.push({
                    id: Date.now(),
                    text,
                    completed: false,
                    completedAt: null,
                    dueDate,
                    category,
                    reminderAt,
                    reminderFired: false,
                    pinned: false,
                    subtasks: []
                });
            }

            taskInput.value = '';
            dueDateInput.value = '';
            reminderInput.value = '';
            categoryInput.value = '';
            saveToStorage();
            render();
        }

        function deleteTodo(id) {
            const index = todos.findIndex(t => t.id === id);
            if (index === -1) return;
            const [removed] = todos.splice(index, 1);
            if (editingId === id) cancelEdit();
            lastDeleted = { todo: removed, index };
            saveToStorage();
            render();
            showUndoToast(removed.text);
        }

        function toggleComplete(id, e) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            todo.completed = !todo.completed;

            if (todo.completed) {
                const now = new Date().toISOString();
                todo.completedAt = now;
                completionLog.push(now);
                saveLog();
                if (e && e.currentTarget) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    fireConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
                }
            } else {
                if (todo.completedAt) {
                    const idx = completionLog.indexOf(todo.completedAt);
                    if (idx !== -1) completionLog.splice(idx, 1);
                    saveLog();
                }
                todo.completedAt = null;
            }

            saveToStorage();
            render();
        }

        function togglePin(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) todo.pinned = !todo.pinned;
            saveToStorage();
            render();
        }

        function startEdit(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            editingId = id;
            taskInput.value = todo.text;
            dueDateInput.value = todo.dueDate || '';
            reminderInput.value = todo.reminderAt || '';
            categoryInput.value = todo.category || '';
            taskInput.focus();
            addBtn.innerHTML = addIconSVG();
        }

        function cancelEdit() {
            editingId = null;
            taskInput.value = '';
            dueDateInput.value = '';
            reminderInput.value = '';
            categoryInput.value = '';
            addBtn.innerHTML = addIconSVG();
        }

        // ---------- Subtasks ----------
        function toggleSubtaskPanel(id) {
            expandedSubtaskId = expandedSubtaskId === id ? null : id;
            render();
        }

        function addSubtask(todoId, text) {
            const t = text.trim();
            if (!t) return;
            const todo = todos.find(x => x.id === todoId);
            if (!todo) return;
            todo.subtasks.push({ id: Date.now(), text: t, completed: false });
            saveToStorage();
            render();
        }

        function toggleSubtask(todoId, subId) {
            const todo = todos.find(x => x.id === todoId);
            if (!todo) return;
            const sub = todo.subtasks.find(s => s.id === subId);
            if (sub) sub.completed = !sub.completed;
            saveToStorage();
            render();
        }

        function deleteSubtask(todoId, subId) {
            const todo = todos.find(x => x.id === todoId);
            if (!todo) return;
            todo.subtasks = todo.subtasks.filter(s => s.id !== subId);
            saveToStorage();
            render();
        }

        // ---------- Undo delete ----------
        function showUndoToast(text) {
            clearTimeout(undoTimeout);
            const shortText = text.length > 28 ? text.slice(0, 28) + '…' : text;
            document.getElementById('undoToastText').textContent = `Deleted "${shortText}"`;
            undoToast.classList.remove('translate-y-24', 'opacity-0');
            undoToast.classList.add('translate-y-0', 'opacity-100');
            undoTimeout = setTimeout(() => { hideUndoToast(); lastDeleted = null; }, 5000);
        }
        function hideUndoToast() {
            undoToast.classList.add('translate-y-24', 'opacity-0');
            undoToast.classList.remove('translate-y-0', 'opacity-100');
        }
        function undoDelete() {
            if (!lastDeleted) return;
            clearTimeout(undoTimeout);
            const { todo, index } = lastDeleted;
            todos.splice(Math.min(index, todos.length), 0, todo);
            lastDeleted = null;
            saveToStorage();
            render();
            hideUndoToast();
        }
        document.getElementById('undoBtn').addEventListener('click', undoDelete);

        // ---------- Reminders ----------
        function checkReminders() {
            const now = new Date();
            let changed = false;
            todos.forEach(todo => {
                if (todo.reminderAt && !todo.completed && !todo.reminderFired) {
                    const reminderTime = new Date(todo.reminderAt);
                    if (reminderTime <= now) {
                        fireReminder(todo);
                        todo.reminderFired = true;
                        changed = true;
                    }
                }
            });
            if (changed) saveToStorage();
        }

        function fireReminder(todo) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('⏰ Task Reminder', { body: todo.text });
            } else {
                showReminderToast(todo.text);
            }
        }

        function showReminderToast(text) {
            document.getElementById('reminderToastText').textContent = `🔔 Reminder: ${text}`;
            reminderToast.classList.remove('translate-y-24', 'opacity-0');
            reminderToast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                reminderToast.classList.add('translate-y-24', 'opacity-0');
                reminderToast.classList.remove('translate-y-0', 'opacity-100');
            }, 5000);
        }

        // ---------- Confetti ----------
        function fireConfetti(x, y) {
            const colors = ['#06b6d4', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6', '#ec4899'];
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('div');
                const isCircle = Math.random() > 0.5;
                el.style.position = 'fixed';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.width = '7px';
                el.style.height = '7px';
                el.style.background = colors[i % colors.length];
                el.style.borderRadius = isCircle ? '50%' : '2px';
                el.style.pointerEvents = 'none';
                el.style.zIndex = 9999;
                document.body.appendChild(el);

                const angle = Math.random() * 2 * Math.PI;
                const distance = 50 + Math.random() * 70;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 30;

                const anim = el.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy + 110}px) rotate(${(Math.random() * 360) | 0}deg)`, opacity: 0 }
                ], { duration: 650 + Math.random() * 400, easing: 'cubic-bezier(.25,.8,.25,1)' });

                anim.onfinish = () => el.remove();
            }
        }

        // ---------- Drag & drop reorder (manual sort only) ----------
        function handleDragStart(e, id) {
            draggedId = id;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.todo-item').forEach(el => el.classList.remove('drag-over'));
        }
        function handleDragOver(e, id) {
            e.preventDefault();
            if (id !== draggedId) e.currentTarget.classList.add('drag-over');
        }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        function handleDrop(e, targetId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (draggedId === null || draggedId === targetId) return;
            const fromIndex = todos.findIndex(t => t.id === draggedId);
            const toIndex = todos.findIndex(t => t.id === targetId);
            if (fromIndex === -1 || toIndex === -1) return;
            const [moved] = todos.splice(fromIndex, 1);
            todos.splice(toIndex, 0, moved);
            draggedId = null;
            saveToStorage();
            render();
        }

        // ---------- Icons ----------
        function addIconSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-white">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>`;
        }
        function editIconSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-cyan-600">
      <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
    </svg>`;
        }
        function deleteIconSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-red-500">
      <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
    </svg>`;
        }
        function dragHandleSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="size-5 text-gray-300">
      <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
      <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
      <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
    </svg>`;
        }
        function starIconSVG(filled) {
            return filled
                ? `<svg xmlns="http://www.w3.org/2000/svg" fill="#eab308" viewBox="0 0 24 24" class="size-5"><path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.563.563 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.563.563 0 0 0-.182-.557l-4.204-3.602a.563.563 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-gray-300"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.563.563 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.563.563 0 0 0-.182-.557l-4.204-3.602a.563.563 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" /></svg>`;
        }
        function checklistIconSVG() {
            return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 text-gray-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.623 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" /></svg>`;
        }

        function categoryBadge(category) {
            if (!category) return '';
            return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">${escapeHtml(category)}</span>`;
        }
        function dueDateBadge(dueDate, completed) {
            if (!dueDate) return '';
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate + 'T00:00:00');
            const isOverdue = !completed && due < today;
            const formatted = due.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
            return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full flex items-center gap-1 ${isOverdue ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'}">
      ${isOverdue ? '⚠️' : '📅'} ${formatted}
    </span>`;
        }
        function reminderBadge(reminderAt, fired) {
            if (!reminderAt) return '';
            const d = new Date(reminderAt);
            const formatted = d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
            return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full flex items-center gap-1 ${fired ? 'bg-gray-100 text-gray-500' : 'bg-cyan-100 text-cyan-700'}">
      🔔 ${formatted}
    </span>`;
        }

        // ---------- Empty / loading states ----------
        function renderSkeleton() {
            todoList.innerHTML = Array(3).fill(0).map(() => `<div class="skeleton bg-white/60 rounded-2xl h-16 w-full"></div>`).join('');
        }
        function emptyState({ icon, message }) {
            return `<div class="flex flex-col items-center justify-center text-center py-10 gap-2">${icon}<p class="text-gray-600 dark:text-white/70 italic transition-colors">${message}</p></div>`;
        }
        const ICONS = {
            clipboard: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="size-12 text-gray-400 dark:text-white/50 transition-colors"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2Z" /></svg>`,
            search: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="size-12 text-gray-400 dark:text-white/50 transition-colors"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="size-12 text-gray-400 dark:text-white/50 transition-colors"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`
        };

        // ---------- Sorting ----------
        function getSorted(list) {
            let sorted = [...list];
            const sortFns = {
                newest: (a, b) => b.id - a.id,
                oldest: (a, b) => a.id - b.id,
                dueDate: (a, b) => {
                    if (!a.dueDate && !b.dueDate) return 0;
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                },
                az: (a, b) => a.text.localeCompare(b.text)
            };
            if (sortFns[currentSort]) sorted.sort(sortFns[currentSort]);
            sorted.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            return sorted;
        }

        // ---------- Render ----------
        function render() {
            const activeCount = todos.filter(t => !t.completed).length;
            const completedCount = todos.filter(t => t.completed).length;
            const totalCount = todos.length;

            document.getElementById('counterText').textContent =
                totalCount === 0 ? 'No tasks yet' : `${activeCount} active · ${completedCount} completed`;

            const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${percent}% complete`;

            filterBtns.forEach(btn => {
                const active = btn.dataset.filter === currentFilter;
                btn.className = `filter-btn px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${active ? 'bg-cyan-500 text-white shadow' : 'bg-black/10 text-gray-700 dark:bg-white/20 dark:text-white/80 hover:bg-black/20 dark:hover:bg-white/30'
                    }`;
            });

            const searchTerm = searchInput.value.trim().toLowerCase();
            let filtered = todos.filter(t => {
                if (currentFilter === 'active' && t.completed) return false;
                if (currentFilter === 'completed' && !t.completed) return false;
                if (searchTerm && !t.text.toLowerCase().includes(searchTerm) && !(t.category || '').toLowerCase().includes(searchTerm)) return false;
                return true;
            });
            filtered = getSorted(filtered);

            todoList.innerHTML = '';

            if (filtered.length === 0) {
                if (totalCount > 0 && searchTerm) todoList.innerHTML = emptyState({ icon: ICONS.search, message: `No tasks match "${searchInput.value.trim()}".` });
                else if (currentFilter === 'completed') todoList.innerHTML = emptyState({ icon: ICONS.check, message: 'No completed tasks yet.' });
                else if (currentFilter === 'active') todoList.innerHTML = emptyState({ icon: ICONS.check, message: 'No active tasks — nice work! 🎉' });
                else todoList.innerHTML = emptyState({ icon: ICONS.clipboard, message: 'No tasks yet. Add one above!' });
                return;
            }

            const isManual = currentSort === 'manual';

            filtered.forEach(todo => {
                const isEditing = editingId === todo.id;
                const subDone = todo.subtasks.filter(s => s.completed).length;
                const subTotal = todo.subtasks.length;
                const isExpanded = expandedSubtaskId === todo.id;

                const item = document.createElement('div');
                item.className = `todo-item bg-white/95 backdrop-blur rounded-2xl px-3 py-3 shadow-lg transition ${isEditing ? 'ring-2 ring-cyan-400' : ''} ${todo.completed ? 'opacity-60' : ''} ${todo.pinned ? 'ring-1 ring-yellow-300' : ''}`;
                item.draggable = isManual;
                item.dataset.id = todo.id;

                item.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            ${isManual ? `<span class="drag-handle shrink-0 hover:cursor-grab active:cursor-grabbing">${dragHandleSVG()}</span>` : `<span class="shrink-0 size-5"></span>`}
            <button type="button" class="toggle-btn shrink-0 size-5 rounded-full border-2 ${todo.completed ? 'bg-cyan-500 border-cyan-500' : 'border-gray-300 hover:border-cyan-400'} flex items-center justify-center transition hover:cursor-pointer" data-id="${todo.id}" aria-label="Toggle complete">
              ${todo.completed ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white" class="size-3"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>` : ''}
            </button>
            <div class="min-w-0 flex-1">
              <p class="break-words leading-snug ${todo.completed ? 'line-through text-gray-400' : isEditing ? 'text-cyan-600 font-semibold' : 'text-gray-800'}">${escapeHtml(todo.text)}</p>
              <div class="flex flex-wrap items-center gap-1.5 mt-1">
                ${categoryBadge(todo.category)}
                ${dueDateBadge(todo.dueDate, todo.completed)}
                ${reminderBadge(todo.reminderAt, todo.reminderFired)}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-0.5 shrink-0">
            <button type="button" class="pin-btn p-1.5 rounded-full hover:cursor-pointer hover:bg-yellow-50 active:scale-90 transition" data-id="${todo.id}" aria-label="Pin task">
              ${starIconSVG(todo.pinned)}
            </button>
            <button type="button" class="edit-btn p-1.5 rounded-full hover:cursor-pointer hover:bg-cyan-50 active:scale-90 transition" data-id="${todo.id}" aria-label="Edit task">
              ${editIconSVG()}
            </button>
            <button type="button" class="delete-btn p-1.5 rounded-full hover:cursor-pointer hover:bg-red-50 active:scale-90 transition" data-id="${todo.id}" aria-label="Delete task">
              ${deleteIconSVG()}
            </button>
          </div>
        </div>

        <button type="button" class="subtask-toggle-btn mt-2 flex items-center gap-1.5 text-xs text-gray-500 hover:cursor-pointer hover:text-cyan-600 transition" data-id="${todo.id}">
          ${checklistIconSVG()} ${subTotal > 0 ? `Subtasks (${subDone}/${subTotal})` : 'Add subtasks'}
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3 transition-transform ${isExpanded ? 'rotate-180' : ''}"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
        </button>

        ${isExpanded ? `
        <div class="mt-2 pl-6 flex flex-col gap-1.5">
          ${todo.subtasks.map(sub => `
            <div class="flex items-center gap-2 group">
              <button type="button" class="sub-toggle-btn shrink-0 size-4 rounded-full border-2 ${sub.completed ? 'bg-cyan-400 border-cyan-400' : 'border-gray-300'} hover:cursor-pointer transition" data-todo-id="${todo.id}" data-sub-id="${sub.id}"></button>
              <span class="text-sm flex-1 ${sub.completed ? 'line-through text-gray-400' : 'text-gray-700'}">${escapeHtml(sub.text)}</span>
              <button type="button" class="sub-delete-btn text-gray-300 hover:text-red-400 hover:cursor-pointer text-xs opacity-0 group-hover:opacity-100 transition" data-todo-id="${todo.id}" data-sub-id="${sub.id}">✕</button>
            </div>
          `).join('')}
          <input type="text" placeholder="+ Add subtask, press Enter" class="sub-add-input text-sm mt-1 px-3 py-1.5 rounded-full bg-gray-50 outline-none focus:ring-2 focus:ring-cyan-300 transition" data-todo-id="${todo.id}" />
        </div>` : ''}
      `;

                if (isManual) {
                    item.addEventListener('dragstart', (e) => handleDragStart(e, todo.id));
                    item.addEventListener('dragend', handleDragEnd);
                    item.addEventListener('dragover', (e) => handleDragOver(e, todo.id));
                    item.addEventListener('dragleave', handleDragLeave);
                    item.addEventListener('drop', (e) => handleDrop(e, todo.id));
                }

                todoList.appendChild(item);
            });

            document.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', (e) => toggleComplete(Number(btn.dataset.id), e)));
            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => startEdit(Number(btn.dataset.id))));
            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteTodo(Number(btn.dataset.id))));
            document.querySelectorAll('.pin-btn').forEach(btn => btn.addEventListener('click', () => togglePin(Number(btn.dataset.id))));
            document.querySelectorAll('.subtask-toggle-btn').forEach(btn => btn.addEventListener('click', () => toggleSubtaskPanel(Number(btn.dataset.id))));
            document.querySelectorAll('.sub-toggle-btn').forEach(btn => btn.addEventListener('click', () => toggleSubtask(Number(btn.dataset.todoId), Number(btn.dataset.subId))));
            document.querySelectorAll('.sub-delete-btn').forEach(btn => btn.addEventListener('click', () => deleteSubtask(Number(btn.dataset.todoId), Number(btn.dataset.subId))));
            document.querySelectorAll('.sub-add-input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        addSubtask(Number(input.dataset.todoId), input.value);
                        input.value = '';
                    }
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---------- Stats modal ----------
        function openStats() {
            const totalCount = todos.length;
            const activeCount = todos.filter(t => !t.completed).length;
            const completedCount = todos.filter(t => t.completed).length;
            const rate = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statActive').textContent = activeCount;
            document.getElementById('statRate').textContent = rate + '%';

            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                days.push(d);
            }
            const counts = days.map(d => {
                const dayStr = d.toISOString().slice(0, 10);
                return completionLog.filter(ts => ts.slice(0, 10) === dayStr).length;
            });
            const maxCount = Math.max(...counts, 1);

            const chart = document.getElementById('statsChart');
            chart.innerHTML = days.map((d, i) => {
                const heightPct = Math.max((counts[i] / maxCount) * 100, counts[i] > 0 ? 8 : 2);
                const label = d.toLocaleDateString('en-IN', { weekday: 'short' }).slice(0, 2);
                return `
        <div class="flex flex-col items-center gap-1 flex-1">
          <span class="text-[10px] text-gray-500 dark:text-white/50">${counts[i] || ''}</span>
          <div class="w-full bg-cyan-400 rounded-t-md transition-all" style="height: ${heightPct}%"></div>
          <span class="text-[10px] text-gray-500 dark:text-white/60">${label}</span>
        </div>`;
            }).join('');

            statsModal.classList.remove('hidden');
            statsModal.classList.add('flex');
        }
        function closeStats() {
            statsModal.classList.add('hidden');
            statsModal.classList.remove('flex');
        }
        statsBtn.addEventListener('click', openStats);
        closeStatsBtn.addEventListener('click', closeStats);
        statsModal.addEventListener('click', (e) => { if (e.target === statsModal) closeStats(); });

        // ---------- Events ----------
        addBtn.addEventListener('click', addTodo);
        taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });
        searchInput.addEventListener('input', render);
        sortSelect.addEventListener('change', () => { currentSort = sortSelect.value; render(); });
        filterBtns.forEach(btn => btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; render(); }));

        // ---------- Init ----------
        loadTheme();
        renderSkeleton();
        setTimeout(() => {
            loadFromStorage();
            loadLog();
            render();
            checkReminders();
            reminderCheckInterval = setInterval(checkReminders, 20000);
        }, 450);
    </script>

</body>

</html>
